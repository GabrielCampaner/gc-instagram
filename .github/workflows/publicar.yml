name: Publicar no Instagram

on:
  schedule:
    - cron: "3-59/10 * * * *"   # a cada 10 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      acao:
        description: "conferir (só lê), teste (prepara sem publicar) ou publicar"
        type: choice
        options: [conferir, teste, publicar]
        default: conferir
      id:
        description: "Post do teste (ex.: L3-01)"
        required: false
  push:
    paths: [pedido.json]          # pedido feito do computador: node publicador/pedir.js conferir | teste <id>

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ACAO: ${{ github.event.inputs.acao || 'publicar' }}
          POST_ID: ${{ github.event.inputs.id }}
          EVENTO: ${{ github.event_name }}
          MIDIA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/
        run: |
          set -o pipefail
          if [ "$EVENTO" = "push" ]; then
            export ACAO="$(jq -r '.acao // "conferir"' pedido.json)" POST_ID="$(jq -r '.id // ""' pedido.json)"
          fi
          node publicador/publicar.js 2>&1 | tee resultado.txt
      - name: Registrar
        if: always()
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          git config user.name "publicador-gc"
          git config user.email "publicador-gc@users.noreply.github.com"
          git add publicados.json
          if [ "$EVENTO" != "schedule" ] && [ -f resultado.txt ]; then
            { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) · $EVENTO · ${{ github.run_id }}"; cat resultado.txt; } > ultimo_resultado.txt
            git add ultimo_resultado.txt
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Registro de publicação"
          git push || (git pull --rebase && git push)
